# Continuous integration on every pull request and on main. Deployments are handled by
# Vercel's Git integration: every PR gets a preview deployment and merges to main go to the dev
# site. Production ships on a version tag (release.yml).
#
# Three jobs run in parallel:
#   check - typecheck, lint, formatting, unit tests, production build (about a minute)
#   e2e   - the game in headless Chromium: every drill played by the autopilots, touch
#           controls, robustness probes and a resource soak (scripts/e2e.mjs). Screenshots
#           and report.json are uploaded as the "e2e-report" artifact.
#   trace - every drill played twice by a seeded autopilot on the manual clock: both runs give
#           the same play, drawn and shown the same, and every drill gives it again from its
#           logged hands alone. Then one frozen frame is painted eight times and has to be one
#           picture (scripts/trace.mjs, `npm run trace`).
# Make check and e2e required checks on main (Settings > Branches > branch protection rule).
# trace runs on every pull request too, so it can be made one.
#
# On a pull request, check also runs the architecture rules as they are on the branch the pull
# request goes into, and fails when the known lists grow (scripts/rules-from-base.mjs): a change
# is judged by rules it did not write. .github/CODEOWNERS lists the files that judge every change.
#
# For a refactor (a pull request whose title starts with "refactor"), trace has two more steps:
# the change has to play exactly like the commit it left main at (`npm run trace:compare`). The
# title is the one the pull request had when the run started: after a change of title, push again.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # the name predates the lint and format steps; it is kept so an existing required-check rule keeps matching
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: The architecture rules as they are on the branch this goes into
        # a change is judged by rules it did not write, and the known lists only get shorter (scripts/rules-from-base.mjs)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # the script that does the judging is the base branch's too, where it has one
          if git cat-file -e FETCH_HEAD:scripts/rules-from-base.mjs 2>/dev/null; then
            git show FETCH_HEAD:scripts/rules-from-base.mjs > scripts/rules-from-base.mjs
          fi
          node scripts/rules-from-base.mjs FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_KNOWN_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'known-list-may-grow') && '1' || '0' }}
      # typecheck already ran above; `npm run build` would repeat it
      - run: npx vite build

  e2e:
    name: End-to-end (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        # the e2e runs headless, which only needs the headless shell (not the full browser download)
        run: npx playwright install --with-deps --only-shell chromium
      - name: Play every drill
        run: npm run e2e
        env:
          SOAK: '30'
          PERF_FRAMES: '30'
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: scripts/out/
          retention-days: 14
          if-no-files-found: ignore

  trace:
    name: Trace (the same play every run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # a refactor must change nothing for the player: it is also compared with main
      REFACTOR: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'refactor') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a refactor's comparison needs the commit this change left main at
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Play every drill twice, then each again from its logged hands
        run: npm run trace
      - name: For a refactor, play every drill here and on main, and compare every frame
        if: env.REFACTOR == 'true'
        run: npm run trace:compare
      - name: The same with the trace tool as it is on the branch this goes into
        # only when this pull request changes the tool: a change to the trace cannot be what makes it pass
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:scripts/trace.mjs 2>/dev/null && ! git diff --quiet FETCH_HEAD -- scripts/trace.mjs; then
            git show FETCH_HEAD:scripts/trace.mjs > scripts/trace.mjs
            npm run trace
            if [ "$REFACTOR" = true ]; then npm run trace:compare; fi
          else
            echo "scripts/trace.mjs is the same as on $BASE_REF"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace
          path: |
            scripts/out/trace/base.json
            scripts/out/trace/head.json
            scripts/out/trace/frozen-frame-*.png
          retention-days: 14
          if-no-files-found: ignore
